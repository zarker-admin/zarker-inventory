<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#051e4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>ZARKER 업무관리</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7fa;font-family:Arial,'Malgun Gothic',sans-serif;color:#051e4b}
.topline{height:5px;background:linear-gradient(90deg,#41afc8,#1487b4,#1c7096)}
.topbar{height:58px;background:#051e4b;color:#fff;display:flex;align-items:center;padding:0 18px;gap:26px;box-shadow:0 3px 14px rgba(5,30,75,.18);border-bottom:2px solid #28a9bd}
.logo{width:138px;min-width:138px;background:transparent;border:0;border-radius:0;padding:0 4px;display:flex;align-items:center;justify-content:flex-start}.logo img{width:108px;opacity:.96}
.logo img{width:112px;height:auto}
.cloudAccount{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#d7e8ef;white-space:nowrap}
.cloudAccount button{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;padding:7px 10px;font-weight:800;cursor:pointer}
.cloudDot{width:8px;height:8px;border-radius:50%;background:#32b4b4;box-shadow:0 0 0 3px rgba(50,180,180,.16)}
.loginGate{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#051e4b 0%,#0b315c 58%,#1c7096 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.loginGate.hidden{display:none}.loginCard{width:min(420px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.authSplash{position:fixed;inset:0;z-index:100000;background:#051e4b;display:flex;align-items:center;justify-content:center}.authSplash.hidden{display:none}.authSplashBrand{font-size:25px;font-weight:950;color:#fff;letter-spacing:.8px}.authSplashDot{display:inline-block;width:8px;height:8px;margin-left:10px;border-radius:50%;background:#32b4b4;animation:cloudPulse 1s ease-in-out infinite}@keyframes cloudPulse{50%{opacity:.25;transform:scale(.75)}}
.loginBrand{color:#1c7096;font-size:28px;font-weight:950;letter-spacing:.5px}.loginTitle{font-size:21px;font-weight:900;margin:18px 0 6px}.loginSub{font-size:13px;color:#667085;line-height:1.55;margin-bottom:18px}
.loginCard input{width:100%;height:46px;border:1px solid #b9ced8;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}.loginButton{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#41afc8,#1487b4);color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:10px}.loginStatus{min-height:20px;color:#c82121;font-size:12px;margin-top:10px}.cloudLoading{color:#1c7096}
.topnav{display:flex;height:100%;gap:5px}.topnav button{display:flex;align-items:center;gap:8px}.topnav button.brandOnly{padding-left:18px;padding-right:18px}.navSymbol{width:22px;height:22px;display:inline-grid;place-items:center;border:1px solid #67809f;border-radius:6px;color:#e3edf7;font-size:15px}.brandMark{width:72px;height:30px;padding:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;overflow:visible}.brandMark img{width:100%;height:100%;object-fit:contain}.coupangMark{width:78px}.topnav button.scheduleNav{padding-left:16px;padding-right:16px}.calendarNavIcon{width:29px;height:29px;display:grid;place-items:center;border:1px solid #67809f;border-radius:7px;color:#fff;background:#0c2d59}.calendarNavIcon svg{width:18px;height:18px}
.topnav button{border:0;background:transparent;color:#c6bfb8;font-weight:800;padding:0 22px;border-bottom:3px solid transparent;cursor:pointer}
.topnav button.active{color:#fff;border-bottom-color:#32b4b4}
.layout{display:flex;height:calc(100vh - 63px)}
.sidebar{width:220px;background:#fafafa;color:#252525;padding:20px 12px;display:none;flex:0 0 220px;border-right:1px solid #e5e7eb}
.sidebar.active{display:block}
.side-title{font-size:20px;font-weight:900;margin:0 0 18px}.sideBrand{display:block;width:92px;height:35px;object-fit:contain;object-position:left center}
.sidebtn{display:block;width:100%;border:0;background:transparent;color:#444;text-align:left;padding:13px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin-bottom:6px}
.sidebtn.active{background:#edf1f7;color:#315aa8;box-shadow:none}
.content{flex:1;min-width:0;background:#f3f7fa}
.frame{display:none;width:100%;height:100%;border:0;background:#f5f7fb}
.frame.active{display:block}
.amazonWorkspace{display:none;height:100%;overflow:hidden}.amazonWorkspace.active{display:flex;flex-direction:column}.amazonWorkspace.active #amazonFrame{display:block;width:100%;flex:1;min-height:0;height:auto}.amazonTools{background:#fff;border-bottom:1px solid #d6e6ed;padding:16px 20px}.amazonTools.hidden{display:none}.amazonToolRow{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.amazonField label{display:block;font-size:12px;font-weight:800;color:#667085;margin-bottom:5px}.amazonField input,.amazonField select{height:39px;border:1px solid #b9ced8;border-radius:8px;padding:8px 10px;min-width:150px;color:#051e4b;background:#fff}.amazonField.wide input{min-width:220px}.amazonAction{border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(135deg,#41afc8,#1487b4)}.amazonAction.gray{background:#1c7096}.amazonAction.red{background:#c82121}.amazonAction.light{background:#e7f2f6;color:#1c7096}.amazonAction.activeView{background:#32b4b4;color:#051e4b}.amazonStatus{font-size:12px;color:#667085;margin-top:9px}.amazonViewSwitch{display:flex;gap:8px;align-items:center;margin-top:10px}.amazonReportFrame{width:100%;flex:1;min-height:0;border:0;background:#f5f7fb}.amazonEmpty{padding:12px;border:1px dashed #b9ced8;border-radius:9px;color:#747776}.amazonRecordMeta{font-size:12px;color:#667085}
@media(max-width:800px){
 .topbar{height:auto;min-height:92px;display:block;padding:8px 10px}
 .logo{margin:0 auto 7px;width:120px;min-width:120px;justify-content:center}.logo img{width:96px}
 .cloudAccount{position:absolute;right:8px;top:8px}.cloudEmail{display:none}.cloudAccount button{padding:5px 8px}
 .topnav{height:42px;display:grid;grid-template-columns:repeat(5,1fr)}
 .topnav button{padding:0 4px;border:0;border-radius:8px;justify-content:center;font-size:11px}.topnav button.active{background:#163766}.navSymbol{display:none}.brandMark{width:54px;height:25px}.coupangMark{width:60px}.topnav button.scheduleNav{padding:0}.calendarNavIcon{width:27px;height:27px;margin:auto}
 .layout{height:calc(100vh - 97px);display:block}
 .sidebar{width:100%;height:auto;padding:7px;display:none;white-space:nowrap;overflow:auto}
 .sidebar.active{display:flex;gap:6px}
 .side-title{display:none}.sidebtn{display:inline-block;width:auto;margin:0;padding:9px 11px}
 .content{height:calc(100% - 54px)}
}
</style>
</head>

  return Object.keys(PACK_RULES[state.selected]||{});

  const rule=(PACK_RULES[state.selected]||{})[x.sku];
  if(rule){

    x.pcsPerPack=rule.pcsPerPack;

}

function persistInvRecords(){localStorage.setItem(INV_RECORD_KEY,JSON.stringify(invRecords))}
function renderInvRecords(){const sel=document.getElementById(&#x27;invRecordSelect&#x27;),meta=document.getElementById(&#x27;invRecordMeta&#x27;);if(!sel)return;if(!invRecords.length){sel.innerHTML=&#x27;&lt;option value=&quot;&quot;&gt;저장된 기록이 없습니다&lt;/option&gt;&#x27;;meta.textContent=&#x27;&#x27;;return}sel.innerHTML=invRecords.map((r,i)=&gt;&#x27;&lt;option value=&quot;&#x27;+i+&#x27;&quot;&gt;&#x27;+r.title+&#x27; · &#x27;+new Date(r.savedAt).toLocaleString(&#x27;ko-KR&#x27;)+&#x27;&lt;/option&gt;&#x27;).reverse().join(&#x27;&#x27;);meta.textContent=&#x27;저장 기록 &#x27;+invRecords.length+&#x27;건&#x27;}

function openInvRecord(){const sel=document.getElementById(&#x27;invRecordSelect&#x27;);if(!sel.value)return alert(&#x27;열 기록을 선택해 주세요.&#x27;);const rec=invRecords[Number(sel.value)];if(!rec)return;state=clone(rec.data);autoSave();renderAll();alert(rec.title+&#x27; 기록을 열었습니다.&#x27;)}

&lt;script&gt;
const API=&#x27;https://script.google.com/macros/s/AKfycbxcJJVeNWWE-Yo3Bp8MGr17ielfAqgCwHQcAeLmUXdA8kPpGcye_Rc_S2VcgLU7W4ULsw/exec&#x27;;
const KEY=&#x27;zarker_work_schedule_shared_v1&#x27;;
let rows=JSON.parse(localStorage.getItem(KEY)||&#x27;[]&#x27;);

function saveLocal(){localStorage.setItem(KEY,JSON.stringify(rows))}
function numberValue(v){return Number(String(v||&#x27;&#x27;).replace(/,/g,&#x27;&#x27;))||0}
function formatNumber(v){return Math.round(numberValue(v)).toLocaleString(&#x27;ko-KR&#x27;)}
function formatQty(el){
 const digits=String(el.value||&#x27;&#x27;).replace(/[^0-9]/g,&#x27;&#x27;);
 el.value=digits?Number(digits).toLocaleString(&#x27;ko-KR&#x27;):&#x27;&#x27;;
}
function addRow(){
 rows.push({date:d.value,channel:channel.value,product:product.value,spec:spec.value,box:Number(box.value)||0,qty:numberValue(qty.value),note:note.value,status:&#x27;작업예정&#x27;});
 saveLocal(); render();
 [&#x27;d&#x27;,&#x27;product&#x27;,&#x27;spec&#x27;,&#x27;box&#x27;,&#x27;qty&#x27;,&#x27;note&#x27;].forEach(id=&gt;document.getElementById(id).value=&#x27;&#x27;);
}
function edit(i,k,v){rows[i][k]=[&#x27;box&#x27;,&#x27;qty&#x27;].includes(k)?numberValue(v):v;saveLocal();render()}
function delRow(i){if(confirm(&#x27;이 작업일정을 삭제할까요?&#x27;)){rows.splice(i,1);saveLocal();render()}}
function esc(s){return String(s??&#x27;&#x27;).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;)}
function render(){
 let h=&#x27;&#x27;;
 if(!rows.length)h=&#x27;&lt;tr&gt;&lt;td colspan=&quot;9&quot; class=&quot;muted&quot;&gt;등록된 작업일정이 없습니다.&lt;/td&gt;&lt;/tr&gt;&#x27;;
 rows.forEach((x,i)=&gt;{
   const cls=x.status===&#x27;완료&#x27;?&#x27;done&#x27;:(x.status===&#x27;진행중&#x27;?&#x27;progress&#x27;:&#x27;&#x27;);

 window[cb]=res=&gt;{

const SCHEDULE_RECORD_KEY=&#x27;zarker_schedule_records_v1&#x27;;
let scheduleRecords=(()=&gt;{try{return JSON.parse(localStorage.getItem(SCHEDULE_RECORD_KEY)||&#x27;[]&#x27;)}catch(e){return[]}})();
if(!Array.isArray(scheduleRecords))scheduleRecords=[];

function renderScheduleRecords(){const sel=document.getElementById(&#x27;scheduleRecordSelect&#x27;),meta=document.getElementById(&#x27;scheduleRecordMeta&#x27;);if(!sel)return;if(!scheduleRecords.length){sel.innerHTML=&#x27;&lt;option value=&quot;&quot;&gt;저장된 기록이 없습니다&lt;/option&gt;&#x27;;meta.textContent=&#x27;&#x27;;return}sel.innerHTML=scheduleRecords.map((r,i)=&gt;&#x27;&lt;option value=&quot;&#x27;+i+&#x27;&quot;&gt;&#x27;+r.title+&#x27; · &#x27;+new Date(r.savedAt).toLocaleString(&#x27;ko-KR&#x27;)+&#x27;&lt;/option&gt;&#x27;).reverse().join(&#x27;&#x27;);meta.textContent=&#x27;저장 기록 &#x27;+scheduleRecords.length+&#x27;건&#x27;}
function saveScheduleRecord(){saveLocal();const input=document.getElementById(&#x27;scheduleRecordTitle&#x27;);const title=input.value.trim()||new Date().toLocaleDateString(&#x27;ko-KR&#x27;)+&#x27; 작업일정&#x27;;scheduleRecords.push({title:title,savedAt:new Date().toISOString(),rows:JSON.parse(JSON.stringify(rows))});persistScheduleRecords();input.value=&#x27;&#x27;;renderScheduleRecords();alert(&#x27;작업일정 기록에 저장했습니다.&#x27;)}
function openScheduleRecord(){const sel=document.getElementById(&#x27;scheduleRecordSelect&#x27;);if(!sel.value)return alert(&#x27;열 기록을 선택해 주세요.&#x27;);const rec=scheduleRecords[Number(sel.value)];if(!rec)return;rows=JSON.parse(JSON.stringify(rec.rows));saveLocal();render();alert(rec.title+&#x27; 기록을 열었습니다.&#x27;)}
function deleteScheduleRecord(){const sel=document.getElementById(&#x27;scheduleRecordSelect&#x27;);if(!sel.value)return alert(&#x27;삭제할 기록을 선택해 주세요.&#x27;);const i=Number(sel.value),rec=scheduleRecords[i];if(!confirm((rec?.title||&#x27;선택 기록&#x27;)+&#x27;을 삭제할까요?&#x27;))return;scheduleRecords.splice(i,1);persistScheduleRecords();renderScheduleRecords()}

 if(!selectedSalesFile&amp;&amp;!selectedStockFile&amp;&amp;!pendingSales&amp;&amp;!pendingStock){alert(&#x27;매출 또는 재고 파일을 선택해 주세요.&#x27;);return}
 btn.disabled=true;btn.textContent=&#x27;파일 읽는 중...&#x27;;
 try{
   // Read the selected files again here so a quick click cannot beat the
   // asynchronous change event, especially for legacy .xls stock files.
   if(selectedSalesFile)pendingSales=detectSales(await readExcel(selectedSalesFile),salesStart.value,salesEnd.value);
   if(selectedStockFile)pendingStock=detectStock(await readExcel(selectedStockFile));
   let rec=state.records[state.current];
   const matchedStock=pendingStock?rec.rows.filter(r=&gt;pendingStock[r.name]!==undefined).length:0;
   rec.rows.forEach(r=&gt;{
     if(pendingSales&amp;&amp;pendingSales[r.name]!==undefined)r.sales=pendingSales[r.name];
     if(pendingStock)r.stock=pendingStock[r.name]!==undefined?pendingStock[r.name]:0;
   });
   if(pendingSalesName)rec.salesFile=pendingSalesName;if(pendingStockName)rec.stockFile=pendingStockName;
   rec.salesStart=salesStart.value;rec.salesEnd=salesEnd.value;rec.avgMonths=salesMonthCount(rec.salesStart,rec.salesEnd);
   saveLocal();render();alert(&#x27;파일 적용 완료&#x27;+(pendingStock?&#x27;\n재고 매칭 품목: &#x27;+matchedStock+&#x27;개\n현재고 합계: &#x27;+fmt(rec.rows.reduce((s,r)=&gt;s+(Number(r.stock)||0),0)):&#x27;&#x27;));
 }catch(err){alert(&#x27;파일 적용 실패: &#x27;+(err&amp;&amp;err.message?err.message:err));}
 finally{btn.disabled=false;btn.textContent=&#x27;두 파일 적용&#x27;;}
}

 const months=Array.from({length:endMonth-startMonth+1},(_,i)=>startMonth+i).map(m=>{const y25=sum(items.filter(x=>x.year===previous&&x.month===m)),y26=sum(items.filter(x=>x.year===current&&x.month===m));return{m,y25,y26,diff:y26-y25}});

 const keys=[...new Set(items.filter(x=>inRange(x)&&(x.year===previous||x.year===current)).map(x=>x.cat+'|||'+x.spec))],details=keys.map(k=>{const [cat,name]=k.split('|||'),y25=sum(items.filter(x=>x.year===previous&&inRange(x)&&x.cat===cat&&x.spec===name)),y26=sum(items.filter(x=>x.year===current&&inRange(x)&&x.cat===cat&&x.spec===name));return{cat,name,y25,y26,diff:y26-y25,rate:y25?y26/y25-1:null}});
 const growth=details.filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,12),declines=details.filter(x=>x.diff<0).sort((a,b)=>a.diff-b.diff).slice(0,12),total25=sum(items.filter(x=>x.year===previous&&inRange(x))),total26=sum(items.filter(x=>x.year===current&&inRange(x)));
 return{history,months,categories:cats,growth,declines,total25,total26,diff:total26-total25,rate:total25?total26/total25-1:null,_meta:{previous,current,startMonth,endMonth,maxMonth,periodText:startMonth===endMonth?startMonth+'월':startMonth+'~'+endMonth+'월',lastDate:new Date(Math.max(...items.filter(x=>x.year===current).map(x=>x.date.getTime()))).toISOString().slice(0,10)}};
}
function renderAmazonData(data,title,fileName){
 const m=data._meta,period=m.periodText||(m.maxMonth+'월'),peak=[...data.history].sort((a,b)=>b.value-a.value)[0];let html=AMAZON_TEMPLATE.replace(/2025/g,String(m.previous)).replace(/2026/g,String(m.current)).replace(/1~7월/g,period).replace(/1~7/g,period).replace('2022년 최고 매출',peak.year+'년 최고 매출');
 html=html.replace(/const D=.*?;const won=/s,'const D='+JSON.stringify(data)+';const won=');
 html=html.replace('x=i=>p.l+i*(W-p.l-p.r)/(arr.length-1)','x=i=>p.l+(arr.length===1?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(arr.length-1))');
 html=html.replace(/<h1>.*?<\/h1>/,'<h1>'+escapeOuter(title)+'</h1>').replace(/자료:.*?· 작성 \d{4}-\d{2}-\d{2}/,'자료: '+escapeOuter(fileName)+' · 작성 '+new Date().toISOString().slice(0,10));amazonFrame.srcdoc=html;
}
function amazonBundleData(bundle,kind){if(bundle&&bundle.cumulative)return bundle[kind]||bundle.cumulative;return bundle}
function showAmazonResult(kind){if(!amazonCurrentData)return;amazonCurrentView=kind;renderAmazonData(amazonBundleData(amazonCurrentData,kind),document.getElementById('amazonReportTitle').value.trim()||'아마존 월보고',amazonCurrentFile);document.getElementById('amazonShowCumulative').className='amazonAction '+(kind==='cumulative'?'activeView':'light');document.getElementById('amazonShowMonthly').className='amazonAction '+(kind==='monthly'?'activeView':'light')}
function escapeOuter(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function saveAmazonRecords(){try{localStorage.setItem(AMAZON_STORE,JSON.stringify(amazonRecords))}catch(e){alert('월보고 기록 저장 공간을 사용할 수 없습니다.')}}
function renderAmazonRecords(){
 const box=document.getElementById('amazonRecordPicker');if(!amazonRecords.length){box.innerHTML='<div class="amazonEmpty">저장된 아마존 월보고가 없습니다.</div>';return}
 const options=amazonRecords.map((r,i)=>({r,i})).reverse().map(x=>'<option value="'+x.i+'">'+escapeOuter(x.r.title)+' · '+new Date(x.r.savedAt).toLocaleDateString('ko-KR')+'</option>').join('');
 box.innerHTML='<div class="amazonField"><label>저장된 월보고 선택</label><select id="amazonRecordSelect">'+options+'</select></div><button id="amazonOpenCumulative" class="amazonAction" type="button">기간 누적 보기</button><button id="amazonOpenMonthly" class="amazonAction light" type="button">해당 월 보기</button><button id="amazonDeleteRecord" class="amazonAction red" type="button">선택 기록 삭제</button><span class="amazonRecordMeta">저장 기록 '+amazonRecords.length+'건</span>';
 const sel=document.getElementById('amazonRecordSelect'),open=k=>{const r=amazonRecords[Number(sel.value)];if(r)renderAmazonData(amazonBundleData(r.data,k),r.title,r.fileName)};document.getElementById('amazonOpenCumulative').addEventListener('click',()=>open('cumulative'));document.getElementById('amazonOpenMonthly').addEventListener('click',()=>open('monthly'));document.getElementById('amazonDeleteRecord').addEventListener('click',()=>{const i=Number(sel.value),r=amazonRecords[i];if(!r||!confirm(r.title+' 기록을 삭제할까요?'))return;amazonRecords.splice(i,1);saveAmazonRecords();renderAmazonRecords();alert('선택한 월보고를 삭제했습니다.')});
 const latest=amazonRecords[amazonRecords.length-1];if(latest)renderAmazonData(amazonBundleData(latest.data,'cumulative'),latest.title,latest.fileName);
}
document.getElementById('amazonAnalyzeBtn').addEventListener('click',async()=>{const f=document.getElementById('amazonFile').files[0],status=document.getElementById('amazonWriteStatus'),year=Number(document.getElementById('amazonBaseYear').value),start=Number(document.getElementById('amazonStartMonth').value),end=Number(document.getElementById('amazonEndMonth').value),month=Number(document.getElementById('amazonCompareMonth').value);if(!f)return alert('아마존 매출 Excel을 선택해 주세요.');if(typeof XLSX==='undefined')return alert('Excel 기능을 불러오지 못했습니다.');if(!year)return alert('기준연도를 입력해 주세요.');status.textContent='Excel 분석 중...';try{const rows=await readAmazonExcel(f);amazonCurrentData={cumulative:analyzeAmazonRows(rows,start,end,year),monthly:analyzeAmazonRows(rows,month,month,year)};amazonCurrentFile=f.name;document.getElementById('amazonViewSwitch').classList.remove('hidden');showAmazonResult('cumulative');const m=amazonCurrentData.cumulative._meta;status.textContent=m.previous+'년 대비 '+m.current+'년 '+m.periodText+' 누적 비교와 '+month+'월 단독 비교를 적용했습니다.'}catch(e){status.textContent='분석 실패';alert('아마존 월보고 분석 실패: '+e.message)}});
document.getElementById('amazonShowCumulative').addEventListener('click',()=>showAmazonResult('cumulative'));
document.getElementById('amazonShowMonthly').addEventListener('click',()=>showAmazonResult('monthly'));
document.getElementById('amazonSaveBtn').addEventListener('click',()=>{if(!amazonCurrentData)return alert('먼저 Excel 분석 적용을 해주세요.');const title=document.getElementById('amazonReportTitle').value.trim()||'아마존 월보고';amazonRecords.push({title,fileName:amazonCurrentFile,savedAt:new Date().toISOString(),data:amazonCurrentData});saveAmazonRecords();document.getElementById('amazonWriteStatus').textContent='월보고 기록에 저장했습니다.';alert('아마존 월보고 기록에 저장했습니다.')});
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';

import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';

const firebaseConfig={
 apiKey:'AIzaSyBJ9ZTI4Q9Z0W90HMhqd1h6VCRi2WA1W5A',
 authDomain:'zarker-work-app.firebaseapp.com',
 projectId:'zarker-work-app',
 storageBucket:'zarker-work-app.firebasestorage.app',
 messagingSenderId:'476304131663',
 appId:'1:476304131663:web:48a60d7942db631fbc4c3a'
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const CLOUD_ITEMS=[
 {id:'home-calendar',key:'zarker_home_calendar_v1'},
 {id:'meeting-reports',key:'zarker_meeting_reports_v1'},
 {id:'inventory',key:'zarkerInvV1'},
 {id:'schedule',key:'zarker_work_schedule_shared_v1'},
 {id:'china-orders',key:'zarker_china_orders_v14'},
 {id:'amazon-reports',key:'zarker_amazon_monthly_reports_v1'}
];
const gate=document.getElementById('loginGate'),splash=document.getElementById('authSplash'),form=document.getElementById('loginForm'),status=document.getElementById('loginStatus'),account=document.getElementById('cloudAccount');
let ready=false,applying=false,lastValues={},unsubs=[],saveTimers={};
const localValue=key=>localStorage.getItem(key)||'';
const friendlyError=e=>{
 const c=String(e&&e.code||'');
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return '이메일 또는 비밀번호가 올바르지 않습니다.';
 if(c.includes('too-many-requests'))return '로그인을 여러 번 시도했습니다. 잠시 후 다시 시도해 주세요.';
 if(c.includes('network'))return '인터넷 연결을 확인해 주세요.';
 return '로그인할 수 없습니다. 입력 내용을 확인해 주세요.';
};
form.addEventListener('submit',async e=>{e.preventDefault();status.className='loginStatus cloudLoading';status.textContent='로그인 중...';try{await signInWithEmailAndPassword(auth,document.getElementById('loginEmail').value.trim(),document.getElementById('loginPassword').value)}catch(err){status.className='loginStatus';status.textContent=friendlyError(err)}});
document.getElementById('logoutBtn').addEventListener('click',()=>signOut(auth));

async function startCloud(user){
 ready=false;applying=true;status.className='loginStatus cloudLoading';status.textContent='클라우드 데이터를 불러오는 중...';
 let changed=false;
 for(const item of CLOUD_ITEMS){
  const ref=doc(db,'zarkerShared',item.id),snap=await getDoc(ref),local=localValue(item.key);
  if(snap.exists()){
   const cloud=String(snap.data().payload||'');
   if(cloud!==local){if(cloud)localStorage.setItem(item.key,cloud);else localStorage.removeItem(item.key);changed=true}
   lastValues[item.key]=cloud;
  }else{
   await setDoc(ref,{payload:local,updatedAt:serverTimestamp(),updatedBy:user.email||''});lastValues[item.key]=local;
  }
 }
 applying=false;ready=true;gate.classList.add('hidden');splash.classList.add('hidden');account.hidden=false;document.getElementById('cloudEmail').textContent=user.email||'';
 unsubs.forEach(f=>f());unsubs=[];
 CLOUD_ITEMS.forEach(item=>{
  const ref=doc(db,'zarkerShared',item.id);
  unsubs.push(onSnapshot(ref,snap=>{
   if(!ready||applying||!snap.exists())return;
   const cloud=String(snap.data().payload||''),local=localValue(item.key);
   if(cloud===local){lastValues[item.key]=cloud;return}
   applying=true;if(cloud)localStorage.setItem(item.key,cloud);else localStorage.removeItem(item.key);lastValues[item.key]=cloud;location.reload();
  }));
 });
 if(changed&&!sessionStorage.getItem('zarker_cloud_reloaded')){sessionStorage.setItem('zarker_cloud_reloaded','1');location.reload();return}
 sessionStorage.removeItem('zarker_cloud_reloaded');
}
async function stopCloud(){ready=false;unsubs.forEach(f=>f());unsubs=[];account.hidden=true;splash.classList.add('hidden');gate.classList.remove('hidden');status.textContent='';document.getElementById('loginPassword').value=''}
onAuthStateChanged(auth,user=>{if(user)startCloud(user).catch(e=>{console.error(e);status.className='loginStatus';status.textContent='클라우드 연결에 실패했습니다. 잠시 후 새로고침해 주세요.'});else stopCloud()});

setInterval(()=>{
 if(!ready||applying||!auth.currentUser)return;
 CLOUD_ITEMS.forEach(item=>{
  const value=localValue(item.key);if(value===lastValues[item.key])return;
  lastValues[item.key]=value;clearTimeout(saveTimers[item.key]);
  saveTimers[item.key]=setTimeout(async()=>{try{await setDoc(doc(db,'zarkerShared',item.id),{payload:value,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email||''})}catch(e){console.error('cloud save',e)}},700);
 });
},1200);
</script>
