function deleteProduct(){if(productNames().length&lt;=1)return alert(&#x27;제품은 최소 1개 필요합니다.&#x27;);if(!confirm(state.selected+&#x27; 제품을 삭제할까요?&#x27;))return;delete state.products[state.selected];state.selected=productNames()[0];autoSave();renderAll()}

function renderSummary(){document.getElementById(&#x27;currentTitle&#x27;).textContent=state.selected+&#x27; 요약&#x27;;let p=cur();let h=&#x27;&#x27;;if(p.type===&#x27;keyed&#x27;){let t=totalsKeyed(p);let cards=[[&#x27;현재재고&#x27;,t.current,&#x27;개&#x27;],[&#x27;작업필요수량&#x27;,t.need,&#x27;개&#x27;],[&#x27;작업후잔량&#x27;,t.remain,&#x27;개&#x27;],[&#x27;아마존입고수량&#x27;,t.amazon,&#x27;개&#x27;],[&#x27;누적발주&#x27;,t.orders,&#x27;개&#x27;]];h=cards.map(c=&gt;`&lt;div class=&quot;summary&quot;&gt;&lt;div class=&quot;label&quot;&gt;${c[0]}&lt;/div&gt;&lt;div class=&quot;value ${c[1]&lt;0?&#x27;warn&#x27;:&#x27;&#x27;}&quot;&gt;${fmt(c[1])}${c[2]}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}else{let t=totalsNormal(p);let cards=[[&#x27;총 가용재고&#x27;,t.current,&#x27;개&#x27;],[&#x27;아마존 가용재고&#x27;,t.amazon,&#x27;개&#x27;],[&#x27;국내재고&#x27;,t.korea,&#x27;개&#x27;],[&#x27;발송예정&#x27;,t.ship,&#x27;개&#x27;],[&#x27;재고개월&#x27;,t.months? t.months.toFixed(1):&#x27;-&#x27;,&#x27;개월&#x27;]];h=cards.map(c=&gt;`&lt;div class=&quot;summary&quot;&gt;&lt;div class=&quot;label&quot;&gt;${c[0]}&lt;/div&gt;&lt;div class=&quot;value&quot;&gt;${typeof c[1]===&#x27;number&#x27;?fmt(c[1]):c[1]}${c[2]}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}document.getElementById(&#x27;summaryGrid&#x27;).innerHTML=h}

function packOptionsForSelected(){
  return Object.keys(PACK_RULES[state.selected]||{});
}

function normalizePlan(x){
  const rule=(PACK_RULES[state.selected]||{})[x.sku];
  if(rule){
    x.packsPerBox=rule.packsPerBox;
    x.pcsPerPack=rule.pcsPerPack;
  }
  return x;
}

function changePlanSku(i,sku){
  let x=cur().plans[i];

  autoSave();renderAll();
}

&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;중국발주 관리 &lt;span class=&quot;versionTag&quot;&gt;v21&lt;/span&gt;&lt;/h1&gt;
  &lt;div class=&quot;sub&quot;&gt;매출 엑셀 + 재고 엑셀을 업로드해 월별 발주검토 기록을 생성하고 과거 기록을 계속 보관합니다.&lt;/div&gt;

  &lt;div class=&quot;card orderOnly&quot;&gt;
    &lt;div class=&quot;uploads&quot;&gt;
      &lt;div class=&quot;uploadbox&quot;&gt;
        &lt;b&gt;① 매출 엑셀파일&lt;/b&gt;
        &lt;input id=&quot;salesFile&quot; type=&quot;file&quot; accept=&quot;.xlsx,.xls,.csv&quot;&gt;
        &lt;div id=&quot;salesName&quot; class=&quot;fileName&quot;&gt;파일을 선택해 주세요.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;uploadbox&quot;&gt;
        &lt;b&gt;② 재고 엑셀파일&lt;/b&gt;
        &lt;input id=&quot;stockFile&quot; type=&quot;file&quot; accept=&quot;.xlsx,.xls,.csv&quot;&gt;
        &lt;div id=&quot;stockName&quot; class=&quot;fileName&quot;&gt;파일을 선택해 주세요.&lt;/div&gt;
      &lt;/div&gt;
      &lt;button id=&quot;applyBtn&quot; class=&quot;btn green&quot; onclick=&quot;applyFiles()&quot;&gt;두 파일 적용&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;statusline&quot;&gt;재고파일은 본사 + 포천 + 쿠팡 + 아마존 재고를 합산합니다. 매출파일은 자커 제품만 제품/규격 기준으로 집계합니다.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card orderOnly&quot;&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;새 기록 제목&lt;/label&gt;&lt;input id=&quot;recordTitle&quot; value=&quot;26.09.01 발주검토&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field month&quot;&gt;&lt;label&gt;판매 집계 시작월&lt;/label&gt;&lt;input id=&quot;salesStart&quot; type=&quot;text&quot; inputmode=&quot;numeric&quot; value=&quot;2025-09&quot; placeholder=&quot;2025-09&quot;&gt;&lt;/div&gt;

    &lt;div id=&quot;fileInfo&quot; class=&quot;statusline&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;card orderOnly&quot;&gt;
    &lt;div class=&quot;summary&quot;&gt;

  &lt;/div&gt;

function mapTarget(spec){

 // Packaging consolidation for the same China-order product.
 if(s.startsWith(&#x27;X50L&#x27;)) return &#x27;X50L&#x27;;
 if(s.startsWith(&#x27;X50&#x27;)) return &#x27;X50&#x27;;
 if(s.startsWith(&#x27;X70&#x27;)) return &#x27;X70&#x27;;
 // New corrosion-resistant brass series: blister/alike labels consolidate by model.

 if(s.startsWith(&#x27;B50&#x27;)) return &#x27;B50&#x27;;
 // J-series: normal + alike consolidated per base model.
 if(s.includes(&#x27;J45S&#x27;)) return &#x27;J45S&#x27;;
 if(s.includes(&#x27;J45&#x27;)&amp;&amp;!s.includes(&#x27;J45S&#x27;)) return &#x27;J45&#x27;;
 if(s.includes(&#x27;J55S&#x27;)) return &#x27;J55S&#x27;;
 if(s.includes(&#x27;J55&#x27;)&amp;&amp;!s.includes(&#x27;J55S&#x27;)) return &#x27;J55&#x27;;
 // S-series packaging is consolidated, while alike-key numbers stay separate.

function amazonNum(v){if(typeof v==='number')return isFinite(v)?v:0;const n=Number(String(v??'').replace(/,/g,'').trim());return isFinite(n)?n:0}
function amazonDate(v){if(v instanceof Date)return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12);if(typeof v==='number'){const u=new Date(Math.round((v-25569)*86400*1000));return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),12)}const s=String(v||'').trim(),m=s.match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12);const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)}
function amazonCategory(product,spec){
 const p=(String(product||'')+' '+String(spec||'')).toUpperCase();
 if(p.includes('부식방지')||/J45|J55|G70|A40|A41/.test(p))return '부식방지';
 if(p.includes('다이얼')||/XD\d|X50|X70/.test(p))return '다이얼';
 if(p.includes('스테인리스')||/S40|S50/.test(p))return '스테인리스';
 if(p.includes('BIKE')||/NO-?\d|C\s?\d/.test(p))return 'BIKE';
 if(p.includes('버튼')||/XB\d/.test(p))return '버튼';return '';
}
async function readAmazonExcel(file){const b=await file.arrayBuffer(),wb=XLSX.read(b,{type:'array',cellDates:true});let rows=[];wb.SheetNames.forEach(n=>rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})));return rows}
function analyzeAmazonRows(rows,startMonth,endMonth,baseYear){
 let hr=-1,cols={};
 for(let i=0;i<Math.min(60,rows.length);i++){
  const h=(rows[i]||[]).map(x=>String(x||'').replace(/\s+/g,'').toLowerCase());
  const date=h.findIndex(x=>/^(날짜|일자|주문일|구매일|purchase-date|orderdate)$/.test(x));
  const product=h.findIndex(x=>/^(품명|제품명|상품명|product|productname)$/.test(x));
  const spec=h.findIndex(x=>/^(규격|제품규격|sku|seller-sku|모델명)$/.test(x));
  let amount=h.findIndex(x=>/^(금액|매출액|상품매출|판매금액|product-sales)$/.test(x));if(amount<0)amount=h.findIndex(x=>/^(합계금액|합계)$/.test(x));
  if(date>=0&&(product>=0||spec>=0)&&amount>=0){hr=i;cols={date,product,spec,amount};break}
 }
 if(hr<0)throw new Error('날짜·품명(또는 규격)·금액 제목 행을 찾지 못했습니다.');
 const items=[];
 for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[],date=amazonDate(r[cols.date]);if(!date)continue;const product=cols.product>=0?String(r[cols.product]||''):'',spec=cols.spec>=0?String(r[cols.spec]||''):product,cat=amazonCategory(product,spec),amount=amazonNum(r[cols.amount]);if(!cat||!spec||!amount)continue;items.push({date,year:date.getFullYear(),month:date.getMonth()+1,cat,spec,amount})}
 if(!items.length)throw new Error('분석 가능한 아마존 제품 매출이 없습니다.');
 startMonth=Number(startMonth)||1;endMonth=Number(endMonth)||startMonth;if(startMonth>endMonth)throw new Error('누적 시작월은 종료월보다 앞서야 합니다.');
 const years=[...new Set(items.map(x=>x.year))].sort((a,b)=>a-b),current=Number(baseYear)||years[years.length-1],previous=current-1,maxMonth=endMonth,inRange=x=>x.month>=startMonth&&x.month<=endMonth;
 if(!years.includes(current))throw new Error('선택한 기준연도 '+current+'년 데이터가 없습니다.');
 if(!years.includes(previous))throw new Error('전년 '+previous+'년 데이터가 없어 비교할 수 없습니다.');
 if(!items.some(x=>x.year===previous&&inRange(x))||!items.some(x=>x.year===current&&inRange(x)))throw new Error(previous+'년과 '+current+'년의 선택 기간 데이터가 모두 필요합니다.');
 const sum=a=>a.reduce((s,x)=>s+x.amount,0),history=years.map(y=>({year:y,value:sum(items.filter(x=>x.year===y)),delta:null,partial:y===current}));history.forEach((x,i)=>{if(i&&x.year!==current)x.delta=history[i-1].value?x.value/history[i-1].value-1:null});
 const months=Array.from({length:endMonth-startMonth+1},(_,i)=>startMonth+i).map(m=>{const y25=sum(items.filter(x=>x.year===previous&&x.month===m)),y26=sum(items.filter(x=>x.year===current&&x.month===m));return{m,y25,y26,diff:y26-y25}});
 const cats=[...new Set(items.map(x=>x.cat))].map(name=>{const y25=sum(items.filter(x=>x.year===previous&&inRange(x)&&x.cat===name)),y26=sum(items.filter(x=>x.year===current&&inRange(x)&&x.cat===name));return{name,y25,y26,diff:y26-y25,rate:y25?y26/y25-1:null}}).filter(x=>x.y25||x.y26).sort((a,b)=>b.y26-a.y26);
 const keys=[...new Set(items.filter(x=>inRange(x)&&(x.year===previous||x.year===current)).map(x=>x.cat+'|||'+x.spec))],details=keys.map(k=>{const [cat,name]=k.split('|||'),y25=sum(items.filter(x=>x.year===previous&&inRange(x)&&x.cat===cat&&x.spec===name)),y26=sum(items.filter(x=>x.year===current&&inRange(x)&&x.cat===cat&&x.spec===name));return{cat,name,y25,y26,diff:y26-y25,rate:y25?y26/y25-1:null}});
 const growth=details.filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,12),declines=details.filter(x=>x.diff<0).sort((a,b)=>a.diff-b.diff).slice(0,12),total25=sum(items.filter(x=>x.year===previous&&inRange(x))),total26=sum(items.filter(x=>x.year===current&&inRange(x)));
 return{history,months,categories:cats,growth,declines,total25,total26,diff:total26-total25,rate:total25?total26/total25-1:null,_meta:{previous,current,startMonth,endMonth,maxMonth,periodText:startMonth===endMonth?startMonth+'월':startMonth+'~'+endMonth+'월',lastDate:new Date(Math.max(...items.filter(x=>x.year===current).map(x=>x.date.getTime()))).toISOString().slice(0,10)}};
}
function renderAmazonData(data,title,fileName){
 const m=data._meta,period=m.periodText||(m.maxMonth+'월'),peak=[...data.history].sort((a,b)=>b.value-a.value)[0];let html=AMAZON_TEMPLATE.replace(/2025/g,String(m.previous)).replace(/2026/g,String(m.current)).replace(/1~7월/g,period).replace(/1~7/g,period).replace('2022년 최고 매출',peak.year+'년 최고 매출');
 html=html.replace(/const D=.*?;const won=/s,'const D='+JSON.stringify(data)+';const won=');
 html=html.replace('x=i=>p.l+i*(W-p.l-p.r)/(arr.length-1)','x=i=>p.l+(arr.length===1?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(arr.length-1))');
 html=html.replace(/<h1>.*?<\/h1>/,'<h1>'+escapeOuter(title)+'</h1>').replace(/자료:.*?· 작성 \d{4}-\d{2}-\d{2}/,'자료: '+escapeOuter(fileName)+' · 작성 '+new Date().toISOString().slice(0,10));amazonFrame.srcdoc=html;
}
function amazonBundleData(bundle,kind){if(bundle&&bundle.cumulative)return bundle[kind]||bundle.cumulative;return bundle}
function showAmazonResult(kind){if(!amazonCurrentData)return;amazonCurrentView=kind;renderAmazonData(amazonBundleData(amazonCurrentData,kind),document.getElementById('amazonReportTitle').value.trim()||'아마존 월보고',amazonCurrentFile);document.getElementById('amazonShowCumulative').className='amazonAction '+(kind==='cumulative'?'activeView':'light');document.getElementById('amazonShowMonthly').className='amazonAction '+(kind==='monthly'?'activeView':'light')}
function escapeOuter(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function saveAmazonRecords(){try{localStorage.setItem(AMAZON_STORE,JSON.stringify(amazonRecords))}catch(e){alert('월보고 기록 저장 공간을 사용할 수 없습니다.')}}
function renderAmazonRecords(){
 const box=document.getElementById('amazonRecordPicker');if(!amazonRecords.length){box.innerHTML='<div class="amazonEmpty">저장된 아마존 월보고가 없습니다.</div>';return}
 const options=amazonRecords.map((r,i)=>({r,i})).reverse().map(x=>'<option value="'+x.i+'">'+escapeOuter(x.r.title)+' · '+new Date(x.r.savedAt).toLocaleDateString('ko-KR')+'</option>').join('');
 box.innerHTML='<div class="amazonField"><label>저장된 월보고 선택</label><select id="amazonRecordSelect">'+options+'</select></div><button id="amazonOpenCumulative" class="amazonAction" type="button">기간 누적 보기</button><button id="amazonOpenMonthly" class="amazonAction light" type="button">해당 월 보기</button><button id="amazonDeleteRecord" class="amazonAction red" type="button">선택 기록 삭제</button><span class="amazonRecordMeta">저장 기록 '+amazonRecords.length+'건</span>';
 const sel=document.getElementById('amazonRecordSelect'),open=k=>{const r=amazonRecords[Number(sel.value)];if(r)renderAmazonData(amazonBundleData(r.data,k),r.title,r.fileName)};document.getElementById('amazonOpenCumulative').addEventListener('click',()=>open('cumulative'));document.getElementById('amazonOpenMonthly').addEventListener('click',()=>open('monthly'));document.getElementById('amazonDeleteRecord').addEventListener('click',()=>{const i=Number(sel.value),r=amazonRecords[i];if(!r||!confirm(r.title+' 기록을 삭제할까요?'))return;amazonRecords.splice(i,1);saveAmazonRecords();renderAmazonRecords();alert('선택한 월보고를 삭제했습니다.')});
 const latest=amazonRecords[amazonRecords.length-1];if(latest)renderAmazonData(amazonBundleData(latest.data,'cumulative'),latest.title,latest.fileName);
}
document.getElementById('amazonAnalyzeBtn').addEventListener('click',async()=>{const f=document.getElementById('amazonFile').files[0],status=document.getElementById('amazonWriteStatus'),year=Number(document.getElementById('amazonBaseYear').value),start=Number(document.getElementById('amazonStartMonth').value),end=Number(document.getElementById('amazonEndMonth').value),month=Number(document.getElementById('amazonCompareMonth').value);if(!f)return alert('아마존 매출 Excel을 선택해 주세요.');if(typeof XLSX==='undefined')return alert('Excel 기능을 불러오지 못했습니다.');if(!year)return alert('기준연도를 입력해 주세요.');status.textContent='Excel 분석 중...';try{const rows=await readAmazonExcel(f);amazonCurrentData={cumulative:analyzeAmazonRows(rows,start,end,year),monthly:analyzeAmazonRows(rows,month,month,year)};amazonCurrentFile=f.name;document.getElementById('amazonViewSwitch').classList.remove('hidden');showAmazonResult('cumulative');const m=amazonCurrentData.cumulative._meta;status.textContent=m.previous+'년 대비 '+m.current+'년 '+m.periodText+' 누적 비교와 '+month+'월 단독 비교를 적용했습니다.'}catch(e){status.textContent='분석 실패';alert('아마존 월보고 분석 실패: '+e.message)}});
document.getElementById('amazonShowCumulative').addEventListener('click',()=>showAmazonResult('cumulative'));
document.getElementById('amazonShowMonthly').addEventListener('click',()=>showAmazonResult('monthly'));
document.getElementById('amazonSaveBtn').addEventListener('click',()=>{if(!amazonCurrentData)return alert('먼저 Excel 분석 적용을 해주세요.');const title=document.getElementById('amazonReportTitle').value.trim()||'아마존 월보고';amazonRecords.push({title,fileName:amazonCurrentFile,savedAt:new Date().toISOString(),data:amazonCurrentData});saveAmazonRecords();document.getElementById('amazonWriteStatus').textContent='월보고 기록에 저장했습니다.';alert('아마존 월보고 기록에 저장했습니다.')});
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';

const firebaseConfig={
 apiKey:'AIzaSyBJ9ZTI4Q9Z0W90HMhqd1h6VCRi2WA1W5A',
 authDomain:'zarker-work-app.firebaseapp.com',
 projectId:'zarker-work-app',
 storageBucket:'zarker-work-app.firebasestorage.app',
 messagingSenderId:'476304131663',
 appId:'1:476304131663:web:48a60d7942db631fbc4c3a'
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const CLOUD_ITEMS=[
 {id:'inventory',key:'zarkerInvV1'},
 {id:'schedule',key:'zarker_work_schedule_shared_v1'},
 {id:'china-orders',key:'zarker_china_orders_v14'},
 {id:'amazon-reports',key:'zarker_amazon_monthly_reports_v1'}
];
const gate=document.getElementById('loginGate'),form=document.getElementById('loginForm'),status=document.getElementById('loginStatus'),account=document.getElementById('cloudAccount');
let ready=false,applying=false,lastValues={},unsubs=[],saveTimers={};
const localValue=key=>localStorage.getItem(key)||'';
const friendlyError=e=>{
 const c=String(e&&e.code||'');
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return '이메일 또는 비밀번호가 올바르지 않습니다.';
 if(c.includes('too-many-requests'))return '로그인을 여러 번 시도했습니다. 잠시 후 다시 시도해 주세요.';
 if(c.includes('network'))return '인터넷 연결을 확인해 주세요.';
 return '로그인할 수 없습니다. 입력 내용을 확인해 주세요.';
};
form.addEventListener('submit',async e=>{e.preventDefault();status.className='loginStatus cloudLoading';status.textContent='로그인 중...';try{await signInWithEmailAndPassword(auth,document.getElementById('loginEmail').value.trim(),document.getElementById('loginPassword').value)}catch(err){status.className='loginStatus';status.textContent=friendlyError(err)}});

async function startCloud(user){
 ready=false;applying=true;status.className='loginStatus cloudLoading';status.textContent='클라우드 데이터를 불러오는 중...';
 let changed=false;
 for(const item of CLOUD_ITEMS){
  const ref=doc(db,'zarkerShared',item.id),snap=await getDoc(ref),local=localValue(item.key);
  if(snap.exists()){
   const cloud=String(snap.data().payload||'');
   if(cloud!==local){if(cloud)localStorage.setItem(item.key,cloud);else localStorage.removeItem(item.key);changed=true}
   lastValues[item.key]=cloud;
  }else{
   await setDoc(ref,{payload:local,updatedAt:serverTimestamp(),updatedBy:user.email||''});lastValues[item.key]=local;
  }
 }
 applying=false;ready=true;gate.classList.add('hidden');account.hidden=false;document.getElementById('cloudEmail').textContent=user.email||'';
 unsubs.forEach(f=>f());unsubs=[];
 CLOUD_ITEMS.forEach(item=>{
  const ref=doc(db,'zarkerShared',item.id);
  unsubs.push(onSnapshot(ref,snap=>{
   if(!ready||applying||!snap.exists())return;
   const cloud=String(snap.data().payload||''),local=localValue(item.key);
   if(cloud===local){lastValues[item.key]=cloud;return}
   applying=true;if(cloud)localStorage.setItem(item.key,cloud);else localStorage.removeItem(item.key);lastValues[item.key]=cloud;sessionStorage.setItem('zarker_cloud_message','다른 기기의 최신 데이터를 반영했습니다.');location.reload();
  }));
 });
 if(changed&&!sessionStorage.getItem('zarker_cloud_reloaded')){sessionStorage.setItem('zarker_cloud_reloaded','1');location.reload();return}
 sessionStorage.removeItem('zarker_cloud_reloaded');
 const msg=sessionStorage.getItem('zarker_cloud_message');if(msg){sessionStorage.removeItem('zarker_cloud_message');setTimeout(()=>alert(msg),500)}
}
async function stopCloud(){ready=false;unsubs.forEach(f=>f());unsubs=[];account.hidden=true;gate.classList.remove('hidden');status.textContent='';document.getElementById('loginPassword').value=''}
onAuthStateChanged(auth,user=>{if(user)startCloud(user).catch(e=>{console.error(e);status.className='loginStatus';status.textContent='클라우드 연결에 실패했습니다. 잠시 후 새로고침해 주세요.'});else stopCloud()});

setInterval(()=>{
 if(!ready||applying||!auth.currentUser)return;
 CLOUD_ITEMS.forEach(item=>{
  const value=localValue(item.key);if(value===lastValues[item.key])return;
  lastValues[item.key]=value;clearTimeout(saveTimers[item.key]);
  saveTimers[item.key]=setTimeout(async()=>{try{await setDoc(doc(db,'zarkerShared',item.id),{payload:value,updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email||''})}catch(e){console.error('cloud save',e)}},700);
 });
},1200);
</script>
